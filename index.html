<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozon Баллы за обзор · Лимит 40 000</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f5f7fc 0%, #e9edf5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 30px 30px 40px;
            box-shadow: 0 25px 50px -10px rgba(0, 20, 40, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: 0.2s;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: #005bff;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 16px -6px rgba(0, 91, 255, 0.3);
        }

        h1 {
            font-weight: 700;
            font-size: 24px;
            color: #0b1b33;
            letter-spacing: -0.3px;
        }

        .badge-limit {
            background: #ff6b4a;
            color: white;
            padding: 10px 22px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 14px rgba(255, 107, 74, 0.25);
        }

        .badge-limit i {
            font-size: 18px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 18px 24px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 14px;
            font-weight: 500;
            color: #2d4059;
            opacity: 0.7;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: #0b1b33;
            margin-top: 4px;
        }

        .stat-value small {
            font-size: 16px;
            font-weight: 400;
            color: #4a5f7a;
            margin-left: 4px;
        }

        .progress-wrap {
            grid-column: 1 / -1;
            margin-top: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(0, 0, 0, 0.07);
            border-radius: 100px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #005bff, #4d8aff);
            border-radius: 100px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #1f334a;
            margin-top: 6px;
            font-weight: 500;
        }

        .calendar-section {
            margin-top: 8px;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .month-year {
            font-weight: 700;
            font-size: 22px;
            color: #0b1b33;
            letter-spacing: -0.2px;
        }

        .nav-btn {
            background: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 20px;
            color: #1f334a;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            transition: 0.15s;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
        }

        .nav-btn:hover {
            background: white;
            box-shadow: 0 8px 18px rgba(0, 20, 40, 0.08);
            transform: scale(0.96);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #3a5370;
            font-size: 14px;
            margin-bottom: 12px;
            letter-spacing: 0.2px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-cell {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 12px 4px;
            text-align: center;
            font-weight: 500;
            color: #14273e;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.1s ease;
            cursor: pointer;
            position: relative;
            min-height: 68px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.01);
        }

        .day-cell:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: #b3c9ff;
            transform: scale(1.02);
        }

        .day-cell.empty {
            background: transparent;
            backdrop-filter: none;
            border: 1px solid transparent;
            cursor: default;
            box-shadow: none;
            opacity: 0.5;
        }

        .day-cell .day-number {
            font-size: 18px;
            font-weight: 600;
        }

        .day-cell .day-points {
            font-size: 12px;
            font-weight: 600;
            background: rgba(0, 91, 255, 0.08);
            padding: 3px 8px;
            border-radius: 40px;
            margin-top: 4px;
            color: #0055cc;
            letter-spacing: 0.2px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(0, 91, 255, 0.05);
        }

        .day-cell .day-points.zero {
            color: #7a8aa0;
            background: rgba(0,0,0,0.02);
        }

        .day-cell.today {
            border: 2px solid #005bff;
            background: rgba(0, 91, 255, 0.06);
            box-shadow: 0 0 0 2px rgba(0, 91, 255, 0.1);
        }

        .day-cell.over-limit {
            background: #ffd9d0;
            border-color: #ff6b4a;
        }

        .day-cell .fa-star {
            color: #ffb800;
            font-size: 10px;
            margin-left: 2px;
        }

        .add-panel {
            margin-top: 28px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 20px 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .add-panel-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .add-panel label {
            font-weight: 600;
            color: #0b1b33;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-panel input {
            border: none;
            background: white;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 16px;
            width: 150px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            border: 1px solid rgba(0, 0, 0, 0.04);
            outline: none;
            transition: 0.15s;
        }

        .add-panel input:focus {
            border-color: #005bff;
            box-shadow: 0 0 0 3px rgba(0, 91, 255, 0.1);
        }

        .add-panel .action-btn {
            background: #005bff;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 18px -6px rgba(0, 91, 255, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .add-panel .action-btn:hover {
            background: #0047cc;
            transform: scale(0.97);
        }

        .add-panel .action-btn.reset-btn {
            background: rgba(0,0,0,0.04);
            color: #1f334a;
            box-shadow: none;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .add-panel .action-btn.reset-btn:hover {
            background: rgba(0,0,0,0.08);
        }

        .footer-meta {
            margin-top: 16px;
            text-align: right;
            font-size: 13px;
            color: #5b6f89;
            opacity: 0.7;
        }

        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            border-radius: 40px;
            padding: 32px 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal-box h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #0b1b33;
        }

        .modal-box .modal-date {
            color: #5b6f89;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .modal-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 60px;
            border: 2px solid #e2e8f0;
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: 0.15s;
            margin-bottom: 16px;
        }

        .modal-box input:focus {
            border-color: #005bff;
            box-shadow: 0 0 0 4px rgba(0, 91, 255, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-actions button {
            padding: 12px 32px;
            border-radius: 60px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
        }

        .modal-actions .btn-confirm {
            background: #005bff;
            color: white;
            box-shadow: 0 6px 14px rgba(0, 91, 255, 0.25);
        }

        .modal-actions .btn-confirm:hover {
            background: #0047cc;
            transform: scale(0.97);
        }

        .modal-actions .btn-cancel {
            background: #f1f4f9;
            color: #1f334a;
        }

        .modal-actions .btn-cancel:hover {
            background: #e2e8f0;
        }

        @media (max-width: 700px) {
            .card { padding: 20px; }
            .header { flex-direction: column; align-items: start; gap: 12px; }
            .badge-limit { align-self: flex-start; }
            .add-panel { flex-direction: column; align-items: stretch; }
            .add-panel-left { flex-wrap: wrap; }
            .add-panel input { width: 100%; }
            .day-cell { min-height: 56px; padding: 8px 2px; }
            .day-cell .day-number { font-size: 16px; }
            .modal-box { padding: 24px 20px; }
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <div class="header">
        <div class="header-left">
            <div class="logo-icon"><i class="fas fa-star"></i></div>
            <h1>Баллы за обзор</h1>
        </div>
        <div class="badge-limit">
            <i class="fas fa-gem"></i> 40 000 / месяц
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-item">
            <span class="stat-label">За всё время</span>
            <span class="stat-value" id="totalAllTime">48 158</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">За месяц</span>
            <span class="stat-value" id="totalMonthPoints">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Остаток на месяц</span>
            <span class="stat-value" id="remainingPoints">40 000</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Дней с баллами</span>
            <span class="stat-value" id="daysWithPoints">0</span>
        </div>
        <div class="progress-wrap">
            <div class="progress-bar-bg">
                <div class="progress-fill" id="progressFill" style="width:0%"></div>
            </div>
            <div class="progress-label">
                <span>0</span>
                <span id="progressPercent">0%</span>
                <span>40 000</span>
            </div>
        </div>
    </div>

    <div class="calendar-section">
        <div class="calendar-nav">
            <button class="nav-btn" id="prevMonth"><i class="fas fa-chevron-left"></i></button>
            <span class="month-year" id="monthYear">Март 2026</span>
            <button class="nav-btn" id="nextMonth"><i class="fas fa-chevron-right"></i></button>
        </div>

        <div class="weekdays">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="add-panel">
        <div class="add-panel-left">
            <label><i class="fas fa-pen-fancy"></i> Баллы</label>
            <input type="number" id="pointsInput" placeholder="Например: 250" min="1" value="100">
            <button class="action-btn" id="addPointsBtn"><i class="fas fa-plus-circle"></i> Добавить</button>
        </div>
        <button class="action-btn reset-btn" id="resetMonthBtn"><i class="fas fa-rotate-left"></i> Сбросить месяц</button>
    </div>
    <div class="footer-meta">
        <i class="far fa-calendar-alt"></i> клик по дню — добавить баллы · лимит обнуляется 1-го числа
    </div>
</div>

<!-- Модальное окно -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h2><i class="fas fa-star" style="color: #ffb800;"></i> Добавить баллы</h2>
        <div class="modal-date" id="modalDate">15 марта 2026</div>
        <input type="number" id="modalPointsInput" placeholder="Количество баллов" min="1" value="100">
        <div class="modal-actions">
            <button class="btn-confirm" id="modalConfirm"><i class="fas fa-check"></i> Добавить</button>
            <button class="btn-cancel" id="modalCancel">Отмена</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const LIMIT = 40000;
        let ALL_TIME_POINTS = 48158;

        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonth = currentDate.getMonth();

        let pointsMap = new Map();
        let selectedDay = null;

        function loadFromStorage() {
            const raw = localStorage.getItem('ozon_points_map');
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    pointsMap = new Map(Object.entries(parsed));
                } catch(e) {
                    pointsMap = new Map();
                }
            } else {
                const today = new Date();
                const y = today.getFullYear();
                const m = String(today.getMonth() + 1).padStart(2,'0');
                const d = String(today.getDate()).padStart(2,'0');
                const demo = {
                    [`${y}-${m}-${d}`]: 350,
                };
                const d2 = new Date(today);
                d2.setDate(today.getDate() - 1);
                const y2 = d2.getFullYear();
                const m2 = String(d2.getMonth() + 1).padStart(2,'0');
                const d2s = String(d2.getDate()).padStart(2,'0');
                demo[`${y2}-${m2}-${d2s}`] = 120;
                const d3 = new Date(today);
                d3.setDate(today.getDate() - 3);
                const y3 = d3.getFullYear();
                const m3 = String(d3.getMonth() + 1).padStart(2,'0');
                const d3s = String(d3.getDate()).padStart(2,'0');
                demo[`${y3}-${m3}-${d3s}`] = 80;
                pointsMap = new Map(Object.entries(demo));
                saveToStorage();
            }

            const allTimeRaw = localStorage.getItem('ozon_all_time_points');
            if (allTimeRaw) {
                const parsed = parseInt(allTimeRaw, 10);
                if (!isNaN(parsed)) ALL_TIME_POINTS = parsed;
            } else {
                ALL_TIME_POINTS = 48158;
                localStorage.setItem('ozon_all_time_points', String(ALL_TIME_POINTS));
            }
        }

        function saveToStorage() {
            const obj = Object.fromEntries(pointsMap);
            localStorage.setItem('ozon_points_map', JSON.stringify(obj));
            localStorage.setItem('ozon_all_time_points', String(ALL_TIME_POINTS));
        }

        function getMonthPoints(year, month) {
            let total = 0;
            const prefix = `${year}-${String(month+1).padStart(2,'0')}`;
            for (const [key, val] of pointsMap) {
                if (key.startsWith(prefix)) total += val;
            }
            return total;
        }

        function getDaysWithPoints(year, month) {
            const prefix = `${year}-${String(month+1).padStart(2,'0')}`;
            let count = 0;
            for (const [key, val] of pointsMap) {
                if (key.startsWith(prefix) && val > 0) count++;
            }
            return count;
        }

        function getRemaining(year, month) {
            const used = getMonthPoints(year, month);
            return Math.max(0, LIMIT - used);
        }

        function getDayPoints(year, month, day) {
            const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            return pointsMap.get(key) || 0;
        }

        function setDayPoints(year, month, day, value) {
            const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            if (value <= 0) {
                pointsMap.delete(key);
            } else {
                pointsMap.set(key, value);
            }
            saveToStorage();
            renderAll();
        }

        function resetMonth(year, month) {
            const prefix = `${year}-${String(month+1).padStart(2,'0')}`;
            for (const key of pointsMap.keys()) {
                if (key.startsWith(prefix)) {
                    pointsMap.delete(key);
                }
            }
            saveToStorage();
            renderAll();
        }

        function addPointsToDay(year, month, day, amount) {
            const currentMonthTotal = getMonthPoints(year, month);
            if (currentMonthTotal + amount > LIMIT) {
                alert(`Лимит ${LIMIT} баллов. Осталось: ${LIMIT - currentMonthTotal}`);
                return false;
            }
            const existing = getDayPoints(year, month, day);
            setDayPoints(year, month, day, existing + amount);
            ALL_TIME_POINTS += amount;
            localStorage.setItem('ozon_all_time_points', String(ALL_TIME_POINTS));
            return true;
        }

        function renderStats(year, month) {
            const total = getMonthPoints(year, month);
            const remaining = getRemaining(year, month);
            const days = getDaysWithPoints(year, month);
            document.getElementById('totalAllTime').textContent = ALL_TIME_POINTS.toLocaleString();
            document.getElementById('totalMonthPoints').textContent = total.toLocaleString();
            document.getElementById('remainingPoints').textContent = remaining.toLocaleString();
            document.getElementById('daysWithPoints').textContent = days;

            const percent = Math.min(100, (total / LIMIT) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = Math.round(percent) + '%';
        }

        function renderCalendar(year, month) {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();

            let startWeekday = firstDay.getDay();
            let offset = (startWeekday === 0) ? 6 : startWeekday - 1;

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            const monthTotal = getMonthPoints(year, month);

            for (let i = 0; i < offset; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                grid.appendChild(empty);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';

                const dayPoints = getDayPoints(year, month, d);
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const isToday = (dateStr === todayStr);

                if (isToday) cell.classList.add('today');

                const dayTotal = getMonthPoints(year, month);
                const isOverLimit = (dayTotal + dayPoints) > LIMIT;
                if (isOverLimit && dayPoints > 0) cell.classList.add('over-limit');

                const numberSpan = document.createElement('span');
                numberSpan.className = 'day-number';
                numberSpan.textContent = d;
                cell.appendChild(numberSpan);

                const pointsSpan = document.createElement('span');
                pointsSpan.className = 'day-points' + (dayPoints === 0 ? ' zero' : '');
                if (dayPoints > 0) {
                    pointsSpan.textContent = dayPoints + ' б.';
                } else {
                    pointsSpan.textContent = '—';
                }
                cell.appendChild(pointsSpan);

                cell.addEventListener('click', function(e) {
                    e.stopPropagation();
                    selectedDay = { year, month, day };
                    const monthNames = ['Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня', 'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'];
                    document.getElementById('modalDate').textContent = `${day} ${monthNames[month]} ${year}`;
                    document.getElementById('modalPointsInput').value = 100;
                    document.getElementById('modalOverlay').classList.add('active');
                });

                grid.appendChild(cell);
            }

            const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            document.getElementById('monthYear').textContent = `${monthNames[month]} ${year}`;
        }

        function renderAll() {
            renderStats(currentYear, currentMonth);
            renderCalendar(currentYear, currentMonth);
        }

        function init() {
            loadFromStorage();

            document.getElementById('prevMonth').addEventListener('click', function() {
                if (currentMonth === 0) {
                    currentMonth = 11;
                    currentYear--;
                } else {
                    currentMonth--;
                }
                renderAll();
            });

            document.getElementById('nextMonth').addEventListener('click', function() {
                if (currentMonth === 11) {
                    currentMonth = 0;
                    currentYear++;
                } else {
                    currentMonth++;
                }
                renderAll();
            });

            document.getElementById('addPointsBtn').addEventListener('click', function() {
                const today = new Date();
                const y = currentYear;
                const m = currentMonth;
                let day = today.getDate();
                if (today.getMonth() !== m || today.getFullYear() !== y) {
                    day = 1;
                } else {
                    const last = new Date(y, m+1, 0).getDate();
                    if (day > last) day = last;
                }

                const input = document.getElementById('pointsInput');
                let val = parseInt(input.value, 10);
                if (isNaN(val) || val < 1) val = 100;
                addPointsToDay(y, m, day, val);
            });

            document.getElementById('resetMonthBtn').addEventListener('click', function() {
                if (confirm(`Сбросить все баллы за ${document.getElementById('monthYear').textContent}?`)) {
                    resetMonth(currentYear, currentMonth);
                }
            });

            // Модальное окно
            document.getElementById('modalConfirm').addEventListener('click', function() {
                if (!selectedDay) return;
                const input = document.getElementById('modalPointsInput');
                let val = parseInt(input.value, 10);
                if (isNaN(val) || val < 1) val = 100;
                const { year, month, day } = selectedDay;
                addPointsToDay(year, month, day, val);
                document.getElementById('modalOverlay').classList.remove('active');
                selectedDay = null;
            });

            document.getElementById('modalCancel').addEventListener('click', function() {
                document.getElementById('modalOverlay').classList.remove('active');
                selectedDay = null;
            });

            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                    selectedDay = null;
                }
            });

            renderAll();
        }

        init();
    })();
</script>
</body>
</html>
